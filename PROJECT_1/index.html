<!DOCTYPE html>
<html>
<head>
    <title>Project 0: Becoming Friends with Your Camera</title>
    <style>
        body {
            font-family: -apple-system, Helvetica, Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.6;
            color: #222;
        }
        h1 {
            font-size: 30px;
            margin-bottom: 0;
        }
        h2 {
            font-size: 22px;
            margin-top: 48px;
            padding-bottom: 8px;
            border-bottom: 1px solid #ddd;
        }
        .row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        figure {
            margin: 0;
            flex: 1;
            min-width: 280px;
        }
        figure img {
            width: 100%;
            height: auto;
            border-radius: 4px;
        }
        figcaption {
            font-size: 14px;
            color: #666;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <h1>Project 0: Becoming Friends with Your Camera</h1>

    <h2>Part 1: Selfie: The Wrong Way vs. The Right Way</h2>
    <div class="row">
        <figure>
            <img src="IMG_7540.jpg" alt="Selfie taken at 1x zoom">
            <figcaption>1x zoom</figcaption>
        </figure>
        <figure>
            <img src="IMG_7541.jpg" alt="Selfie taken at 4x zoom">
            <figcaption>4x zoom</figcaption>
        </figure>
    </div>

    <h2>Part 2: Architectural Perspective Compression</h2>
    <div class="row">
        <figure>
            <img src="IMG_7539.jpg" alt="Building shot at 1x zoom">
            <figcaption>1x zoom</figcaption>
        </figure>
        <figure>
            <img src="IMG_7536.jpg" alt="Building shot at 4x zoom">
            <figcaption>4x zoom</figcaption>
        </figure>
    </div>

    <h2>Part 3: The Dolly Zoom</h2>
</body>
</html>
